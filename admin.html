<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | Rapid Retrievals</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg-primary:#0a0a0f;--bg-secondary:#111118;--bg-tertiary:#1a1a2e;--text-primary:#e5e7eb;--text-secondary:#9ca3af;--text-muted:#6b7280;--accent:#f59e0b;--card-bg:#16161f;--card-border:#2d2d44;--shadow:0 4px 20px rgba(0,0,0,0.3);--shadow-lg:0 10px 40px rgba(0,0,0,0.4);--input-bg:#1a1a2e;--error:#ef4444;--success:#22c55e;--warning:#f59e0b;--info:#3b82f6;--purple:#a855f7;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow-x:hidden;}
h1,h2,h3,h4{font-family:'Playfair Display',serif;}

/* LOGIN */
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:linear-gradient(135deg,#0a0a0f 0%,#1a1a2e 100%);}
.login-box{background:var(--card-bg);border:1px solid var(--card-border);border-radius:20px;padding:48px 40px;max-width:420px;width:100%;text-align:center;box-shadow:var(--shadow-lg);}
.login-box img{height:50px;margin:0 auto 20px;object-fit:contain;}
.login-box h2{font-size:1.5rem;margin-bottom:6px;}
.login-box p{color:var(--text-muted);font-size:.9rem;margin-bottom:28px;}
.login-input{width:100%;padding:14px 18px;border-radius:10px;border:1.5px solid var(--card-border);background:var(--input-bg);color:var(--text-primary);font-family:'Inter',sans-serif;font-size:1rem;outline:none;transition:all .3s;text-align:center;letter-spacing:2px;}
.login-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,158,11,.15);}
.login-error{color:var(--error);font-size:.85rem;margin-top:12px;display:none;}
.login-btn{width:100%;padding:14px;border-radius:10px;background:var(--accent);color:#0d1b3e;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:1rem;font-weight:600;margin-top:16px;transition:all .3s;}
.login-btn:hover{background:#fbbf24;transform:translateY(-1px);}

/* DASHBOARD */
.dashboard{display:none;padding:0;}
.top-bar{background:var(--bg-secondary);border-bottom:1px solid var(--card-border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.top-bar-left{display:flex;align-items:center;gap:16px;}
.top-bar-left img{height:38px;object-fit:contain;}
.top-bar-left h3{font-size:1.1rem;color:var(--text-primary);}
.top-bar-left span{font-size:.78rem;color:var(--text-muted);font-family:'Inter',sans-serif;font-weight:400;}
.logout-btn{padding:8px 18px;border-radius:8px;background:transparent;border:1.5px solid var(--card-border);color:var(--text-secondary);font-family:'Inter',sans-serif;font-size:.85rem;font-weight:500;cursor:pointer;transition:all .3s;display:flex;align-items:center;gap:6px;}
.logout-btn:hover{border-color:var(--error);color:var(--error);}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;padding:24px 32px;background:var(--bg-secondary);border-bottom:1px solid var(--card-border);}
.stat-card{text-align:center;padding:16px 8px;border-radius:12px;background:var(--bg-primary);border:1px solid var(--card-border);}
.stat-card .num{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:700;color:var(--accent);}
.stat-card .lbl{font-size:.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}

/* FILTERS */
.filters-bar{padding:20px 32px;background:var(--bg-secondary);border-bottom:1px solid var(--card-border);display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.filters-bar label{font-size:.85rem;color:var(--text-muted);font-weight:500;}
.filter-btn{padding:8px 16px;border-radius:50px;border:1.5px solid var(--card-border);background:transparent;color:var(--text-secondary);font-family:'Inter',sans-serif;font-size:.8rem;font-weight:500;cursor:pointer;transition:all .3s;}
.filter-btn:hover{border-color:var(--accent);color:var(--accent);}
.filter-btn.active{background:var(--accent);color:#0d1b3e;border-color:var(--accent);font-weight:600;}
.search-filter{margin-left:auto;padding:10px 16px;border-radius:8px;border:1.5px solid var(--card-border);background:var(--input-bg);color:var(--text-primary);font-family:'Inter',sans-serif;font-size:.85rem;outline:none;width:220px;transition:border-color .3s;}
.search-filter:focus{border-color:var(--accent);}

/* CASE LIST */
.case-list{padding:24px 32px 80px;max-width:1200px;margin:0 auto;}
.case-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;padding:24px;margin-bottom:16px;transition:all .3s;cursor:pointer;position:relative;overflow:hidden;}
.case-card:hover{border-color:rgba(245,158,11,.3);box-shadow:var(--shadow);}
.case-card-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
.case-id{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:var(--accent);}
.case-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.case-meta-item{font-size:.8rem;color:var(--text-muted);display:flex;align-items:center;gap:5px;}
.case-meta-item i{font-size:.75rem;color:var(--accent);}
.status-badge{padding:5px 14px;border-radius:50px;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;transition:all .3s;border:none;}
.status-badge:hover{transform:scale(1.05);filter:brightness(1.1);}
.status-logged{background:rgba(59,130,246,.12);color:var(--info);border:1px solid rgba(59,130,246,.25);}
.status-open{background:rgba(168,85,247,.12);color:var(--purple);border:1px solid rgba(168,85,247,.25);}
.status-in-progress{background:rgba(245,158,11,.12);color:var(--warning);border:1px solid rgba(245,158,11,.25);}
.status-located{background:rgba(34,197,94,.12);color:var(--success);border:1px solid rgba(34,197,94,.25);}
.status-recovered{background:rgba(34,197,94,.18);color:var(--success);border:1.5px solid rgba(34,197,94,.4);}
.status-closed{background:rgba(107,114,128,.12);color:var(--text-muted);border:1px solid rgba(107,114,128,.25);}
.case-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}
.case-detail{font-size:.84rem;display:flex;gap:8px;}
.case-detail .cd-label{color:var(--text-muted);min-width:90px;}
.case-detail .cd-value{color:var(--text-primary);font-weight:500;}

/* STATUS DROPDOWN */
.status-dropdown{position:absolute;top:60px;right:24px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:8px;box-shadow:var(--shadow-lg);z-index:50;display:none;min-width:180px;}
.status-dropdown.show{display:block;animation:dropIn .2s ease;}
@keyframes dropIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.status-option{padding:10px 14px;border-radius:8px;font-size:.85rem;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .2s;color:var(--text-secondary);}
.status-option:hover{background:var(--input-bg);}
.status-option .so-dot{width:10px;height:10px;border-radius:50%;min-width:10px;}
.so-logged{background:var(--info);}.so-open{background:var(--purple);}.so-in-progress{background:var(--warning);}.so-located{background:var(--success);}.so-recovered{background:var(--success);}.so-closed{background:var(--text-muted);}

/* EMPTY */
.empty-state{text-align:center;padding:80px 20px;color:var(--text-muted);}
.empty-state i{font-size:3rem;margin-bottom:16px;opacity:.4;}
.empty-state h3{font-size:1.2rem;color:var(--text-secondary);margin-bottom:6px;}
.empty-state p{font-size:.9rem;}

/* NOTE MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center;padding:24px;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;padding:32px;max-width:500px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:dropIn .25s ease;}
.modal-box h3{font-size:1.2rem;margin-bottom:8px;}
.modal-box p{color:var(--text-secondary);font-size:.9rem;margin-bottom:20px;line-height:1.6;}
.modal-textarea{width:100%;padding:12px;border-radius:8px;border:1.5px solid var(--card-border);background:var(--input-bg);color:var(--text-primary);font-family:'Inter',sans-serif;font-size:.9rem;outline:none;resize:vertical;min-height:100px;margin-bottom:16px;transition:border-color .3s;}
.modal-textarea:focus{border-color:var(--accent);}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;}
.modal-btn{padding:10px 20px;border-radius:8px;font-family:'Inter',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;border:none;transition:all .3s;}
.modal-btn-save{background:var(--accent);color:#0d1b3e;}.modal-btn-save:hover{background:#fbbf24;}
.modal-btn-cancel{background:transparent;color:var(--text-secondary);border:1.5px solid var(--card-border);}.modal-btn-cancel:hover{background:var(--input-bg);}

/* TOAST */
.toast{position:fixed;bottom:30px;right:30px;background:var(--success);color:#fff;padding:14px 24px;border-radius:10px;font-size:.9rem;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:300;transform:translateY(100px);opacity:0;transition:all .4s;display:flex;align-items:center;gap:10px;}
.toast.show{transform:translateY(0);opacity:1;}
.toast i{font-size:1.1rem;}

@media(max-width:768px){
  .stats-row{grid-template-columns:repeat(3,1fr);padding:16px;}
  .filters-bar{padding:16px;}.search-filter{width:100%;margin-left:0;margin-top:8px;}
  .case-list{padding:16px;}
  .case-card-top{flex-direction:column;align-items:flex-start;}
  .case-details{grid-template-columns:1fr;}
  .status-dropdown{right:16px;top:auto;bottom:80px;}
  .top-bar{padding:12px 16px;}
  .top-bar-left h3{font-size:.95rem;}
}
@media(max-width:480px){
  .stats-row{grid-template-columns:repeat(2,1fr);gap:10px;}
  .login-box{padding:36px 24px;}
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <img src="new_rapid_logo.png" alt="Rapid Retrievals">
    <h2>Admin Panel</h2>
    <p>Enter the admin access key to continue</p>
    <input type="password" class="login-input" id="accessKeyInput" placeholder="••••••••" autocomplete="off">
    <div class="login-error" id="loginError"><i class="fas fa-exclamation-circle"></i> Invalid access key. Try again.</div>
    <button class="login-btn" onclick="attemptLogin()"><i class="fas fa-lock"></i> Unlock Panel</button>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="top-bar">
    <div class="top-bar-left">
      <img src="new_rapid_logo.png" alt="Rapid Retrievals">
      <div>
        <h3>Case Management</h3>
        <span>Admin Dashboard</span>
      </div>
    </div>
    <button class="logout-btn" onclick="logout()"><i class="fas fa-right-from-bracket"></i> Logout</button>
  </div>

  <div class="stats-row" id="statsRow">
    <div class="stat-card"><div class="num" id="statTotal">0</div><div class="lbl">Total</div></div>
    <div class="stat-card"><div class="num" id="statLogged">0</div><div class="lbl">Logged</div></div>
    <div class="stat-card"><div class="num" id="statOpen">0</div><div class="lbl">Open</div></div>
    <div class="stat-card"><div class="num" id="statProgress">0</div><div class="lbl">In Progress</div></div>
    <div class="stat-card"><div class="num" id="statLocated">0</div><div class="lbl">Located</div></div>
    <div class="stat-card"><div class="num" id="statRecovered">0</div><div class="lbl">Recovered</div></div>
  </div>

  <div class="filters-bar">
    <label>Filter:</label>
    <button class="filter-btn active" data-filter="all" onclick="filterCases('all',this)">All</button>
    <button class="filter-btn" data-filter="Logged" onclick="filterCases('Logged',this)">Logged</button>
    <button class="filter-btn" data-filter="Open" onclick="filterCases('Open',this)">Open</button>
    <button class="filter-btn" data-filter="In Progress" onclick="filterCases('In Progress',this)">In Progress</button>
    <button class="filter-btn" data-filter="Located" onclick="filterCases('Located',this)">Located</button>
    <button class="filter-btn" data-filter="Recovered" onclick="filterCases('Recovered',this)">Recovered</button>
    <button class="filter-btn" data-filter="Closed" onclick="filterCases('Closed',this)">Closed</button>
    <input type="text" class="search-filter" id="searchFilter" placeholder="Search case ID or name..." oninput="renderCases()">
  </div>

  <div class="case-list" id="caseList"></div>
</div>

<!-- STATUS DROPDOWN (reused) -->
<div class="status-dropdown" id="statusDropdown"></div>

<!-- NOTE MODAL -->
<div class="modal-overlay" id="noteModal">
  <div class="modal-box">
    <h3><i class="fas fa-sticky-note" style="color:var(--accent);margin-right:6px;"></i> Add Internal Note</h3>
    <p>Case: <strong id="noteCaseId"></strong></p>
    <textarea class="modal-textarea" id="noteText" placeholder="e.g. Contacted client, awaiting documents..."></textarea>
    <div class="modal-btns">
      <button class="modal-btn modal-btn-cancel" onclick="closeNoteModal()">Cancel</button>
      <button class="modal-btn modal-btn-save" onclick="saveNote()"><i class="fas fa-check"></i> Save Note</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg">Status updated!</span></div>

<script>
// ===== CONFIG =====
// Change this to your desired admin access key
var ADMIN_KEY='rapid2025';
var noteCaseId='';

// ===== LOGIN =====
function attemptLogin(){
  var key=document.getElementById('accessKeyInput').value.trim();
  if(key===ADMIN_KEY){
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('dashboard').style.display='block';
    renderCases();
  }else{
    document.getElementById('loginError').style.display='block';
    document.getElementById('accessKeyInput').style.borderColor='var(--error)';
    setTimeout(function(){document.getElementById('loginError').style.display='none';document.getElementById('accessKeyInput').style.borderColor='';},3000);
  }
}
document.getElementById('accessKeyInput').addEventListener('keypress',function(e){if(e.key==='Enter')attemptLogin();});

function logout(){
  document.getElementById('dashboard').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('accessKeyInput').value='';
}

// ===== DATA =====
function getCases(){return JSON.parse(localStorage.getItem('rapidCases')||'{}');}
function saveCases(cases){localStorage.setItem('rapidCases',JSON.stringify(cases));}

// ===== STATS =====
function updateStats(){
  var cases=getCases();var keys=Object.keys(cases);
  var counts={Total:keys.length,Logged:0,Open:0,'In Progress':0,Located:0,Recovered:0,Closed:0};
  keys.forEach(function(k){var s=cases[k].status;if(counts.hasOwnProperty(s))counts[s]++;});
  document.getElementById('statTotal').textContent=counts.Total;
  document.getElementById('statLogged').textContent=counts.Logged;
  document.getElementById('statOpen').textContent=counts.Open;
  document.getElementById('statProgress').textContent=counts['In Progress'];
  document.getElementById('statLocated').textContent=counts.Located;
  document.getElementById('statRecovered').textContent=counts.Recovered;
}

// ===== RENDER =====
var currentFilter='all';
function filterCases(filter,btn){
  currentFilter=filter;
  document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
  if(btn)btn.classList.add('active');
  renderCases();
}

function renderCases(){
  var cases=getCases();var keys=Object.keys(cases);
  var searchVal=document.getElementById('searchFilter').value.trim().toUpperCase();
  var container=document.getElementById('caseList');
  updateStats();

  // Sort newest first
  keys.sort(function(a,b){return(b.localeCompare(a));});

  var html='';
  var visibleCount=0;

  keys.forEach(function(key){
    var c=cases[key];
    // Filter
    if(currentFilter!=='all'&&c.status!==currentFilter)return;
    // Search
    if(searchVal){
      var match=key.toUpperCase().indexOf(searchVal)>-1;
      if(!match&&c.make&&c.make.toUpperCase().indexOf(searchVal)>-1)match=true;
      if(!match&&c.model&&c.model.toUpperCase().indexOf(searchVal)>-1)match=true;
      if(!match&&c.assetType&&c.assetType.toUpperCase().indexOf(searchVal)>-1)match=true;
      if(!match)return;
    }
    visibleCount++;

    var statusClass='status-'+c.status.toLowerCase().replace(/\s+/g,'-');
    var now=new Date();
    var timeAgo='';
    if(c.dateReported){
      var reported=new Date(c.dateReported);
      var diffMs=now-reported;var diffMins=Math.floor(diffMs/60000);
      if(diffMins<1)timeAgo='Just now';
      else if(diffMins<60)timeAgo=diffMins+'m ago';
      else if(diffMins<1440)timeAgo=Math.floor(diffMins/60)+'h ago';
      else timeAgo=Math.floor(diffMins/1440)+'d ago';
    }

    html+='<div class="case-card" id="card-'+key+'" data-caseid="'+key+'">';
    html+='<div class="case-card-top">';
    html+='<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">';
    html+='<span class="case-id">'+key+'</span>';
    html+='<button class="status-badge '+statusClass+'" onclick="toggleDropdown(event,\''+key+'\')"><i class="fas fa-pen" style="font-size:.65rem;margin-right:4px;"></i> '+c.status+'</button>';
    html+='</div>';
    html+='<div class="case-meta">';
    html+='<span class="case-meta-item"><i class="fas fa-tag"></i> '+c.assetType+'</span>';
    if(c.make||c.model)html+='<span class="case-meta-item"><i class="fas fa-car"></i> '+(c.make||'')+' '+(c.model||'')+'</span>';
    html+='<span class="case-meta-item"><i class="fas fa-clock"></i> '+timeAgo+'</span>';
    html+='<button onclick="openNoteModal(\''+key+'\')" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.85rem;padding:4px 8px;border-radius:6px;transition:color .2s;" onmouseover="this.style.color=\'var(--accent)\'" onmouseout="this.style.color=\'var(--text-muted)\'"><i class="fas fa-sticky-note"></i></button>';
    html+='</div></div>';

    html+='<div class="case-details">';
    if(c.lastSeen)html+='<div class="case-detail"><span class="cd-label">Last Seen:</span><span class="cd-value">'+c.lastSeen+'</span></div>';
    if(c.timeOfTheft&&c.timeOfTheft!=='Not specified')html+='<div class="case-detail"><span class="cd-label">Time of Theft:</span><span class="cd-value">'+c.timeOfTheft+'</span></div>';
    if(c.dateReported)html+='<div class="case-detail"><span class="cd-label">Reported:</span><span class="cd-value">'+c.dateReported+'</span></div>';
    if(c.phone)html+='<div class="case-detail"><span class="cd-label">Phone:</span><span class="cd-value">'+c.phone+'</span></div>';
    if(c.email)html+='<div class="case-detail"><span class="cd-label">Email:</span><span class="cd-value">'+c.email+'</span></div>';

    // Show notes
    if(c.notes&&c.notes.length>0){
      html+='<div class="case-detail" style="grid-column:1/-1;margin-top:6px;padding-top:8px;border-top:1px solid var(--card-border);">';
      html+='<span class="cd-label">Notes:</span>';
      c.notes.forEach(function(n){
        html+='<span class="cd-value" style="display:block;margin-bottom:4px;font-weight:400;font-size:.8rem;color:var(--text-secondary);">['+n.time+'] '+n.text+'</span>';
      });
      html+='</div>';
    }
    html+='</div></div>';
  });

  if(visibleCount===0){
    html='<div class="empty-state"><i class="fas fa-inbox"></i><h3>No cases found</h3><p>'+(searchVal?'No cases match your search.':currentFilter!=='all'?'No cases with status "'+currentFilter+'".':'No cases have been submitted yet.')+'</p></div>';
}

  container.innerHTML=html;
}

// ===== STATUS DROPDOWN =====
var activeDropdown=null;
function toggleDropdown(e,caseId){
  e.stopPropagation();
  closeDropdown();
  var statuses=['Logged','Open','In Progress','Located','Recovered','Closed'];
  var dd=document.getElementById('statusDropdown');
  var html='';
  statuses.forEach(function(s){
    var cls='so-'+s.toLowerCase().replace(/\s+/g,'-');
    html+='<div class="status-option" onclick="changeStatus(\''+caseId+'\',\''+s+'\')"><div class="so-dot '+cls+'"></div> '+s+'</div>';
  });
  dd.innerHTML=html;

  var card=document.getElementById('card-'+caseId);
  var rect=card.getBoundingClientRect();
  dd.style.top=(rect.top+window.scrollY-10)+'px';
  dd.style.right=(window.innerWidth-rect.right+16)+'px';
  dd.style.left='auto';
  dd.classList.add('show');
  activeDropdown=caseId;
}

function closeDropdown(){
  document.getElementById('statusDropdown').classList.remove('show');
  activeDropdown=null;
}
document.addEventListener('click',function(){closeDropdown();});

function changeStatus(caseId,newStatus){
  var cases=getCases();
  if(!cases[caseId])return;
  var oldStatus=cases[caseId].status;
  cases[caseId].status=newStatus;

  // Add to timeline
  var now=new Date();
  var timeStr=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  var dateStr=now.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  if(!cases[caseId].timeline)cases[caseId].timeline=[];
  cases[caseId].timeline.unshift({time:dateStr+' '+timeStr,event:'Status changed: '+oldStatus+' → '+newStatus});

  saveCases(cases);
  closeDropdown();
  renderCases();
  showToast('Status updated to "'+newStatus+'"');
}

// ===== NOTES =====
function openNoteModal(caseId){
  noteCaseId=caseId;
  document.getElementById('noteCaseId').textContent=caseId;
  document.getElementById('noteText').value='';
  document.getElementById('noteModal').classList.add('show');
}
function closeNoteModal(){
  document.getElementById('noteModal').classList.remove('show');
  noteCaseId='';
}
function saveNote(){
  var text=document.getElementById('noteText').value.trim();
  if(!text||!noteCaseId)return;
  var cases=getCases();
  if(!cases[noteCaseId])return;
  var now=new Date();
  var timeStr=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  var dateStr=now.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  if(!cases[noteCaseId].notes)cases[noteCaseId].notes=[];
  cases[noteCaseId].notes.unshift({time:dateStr+' '+timeStr,text:text});
  if(!cases[noteCaseId].timeline)cases[noteCaseId].timeline=[];
  cases[noteCaseId].timeline.unshift({time:dateStr+' '+timeStr,event:'Note: '+text});
  saveCases(cases);
  closeNoteModal();
  renderCases();
  showToast('Note saved successfully');
}

// ===== TOAST =====
function showToast(msg){
  var toast=document.getElementById('toast');
  document.getElementById('toastMsg').textContent=msg;
  toast.classList.add('show');
  setTimeout(function(){toast.classList.remove('show');},3000);
}
</script>
